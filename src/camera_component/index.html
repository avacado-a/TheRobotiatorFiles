<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Face Scanner</title>
  <!-- Load MediaPipe Face Mesh via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #00251a;
      color: #e0f2f1;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #app-container {
      position: relative;
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(0, 37, 26, 0.95);
      border-radius: 16px;
      border: 1px dashed rgba(255, 202, 40, 0.3);
      padding: 16px;
      box-sizing: border-box;
    }

    /* Screen Flash Effect */
    #flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease-out;
      border-radius: 16px;
      z-index: 10;
    }

    #video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: 12px;
      overflow: hidden;
      background-color: #00120d;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    video {
      display: none; /* hidden, drawn to canvas instead */
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      transform: scaleX(-1); /* Mirror view */
    }

    #info-panel {
      width: 100%;
      margin-top: 16px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      border: 1px solid rgba(255, 202, 40, 0.15);
      box-sizing: border-box;
      text-align: center;
    }

    h2 {
      margin: 0 0 8px 0;
      color: #ffca28;
      font-size: 1.25rem;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }

    p {
      margin: 0;
      font-size: 0.95rem;
      color: #b0bec5;
      line-height: 1.4;
    }

    /* Loading overlay */
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #00251a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      border-radius: 16px;
    }

    .spinner {
      border: 4px solid rgba(255, 202, 40, 0.1);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border-left-color: #ffca28;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Step indicator dots */
    #step-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }

    .dot.active {
      background: #ffca28;
      transform: scale(1.2);
      box-shadow: 0 0 8px #ffca28;
    }

    .dot.completed {
      background: #2e7d32;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="flash-overlay"></div>

    <div id="loading-overlay">
      <div class="spinner"></div>
      <div id="loading-text">Loading Face Detection AI Model...</div>
    </div>

    <div id="video-wrapper">
      <video id="webcam" playsinline></video>
      <canvas id="output-canvas" width="640" height="480"></canvas>
    </div>

    <div id="info-panel">
      <h2 id="instruction-title">Setting Up...</h2>
      <p id="instruction-desc">Please grant camera permissions when prompted.</p>
      
      <div id="step-dots">
        <div class="dot" id="dot-0"></div>
        <div class="dot" id="dot-1"></div>
        <div class="dot" id="dot-2"></div>
        <div class="dot" id="dot-3"></div>
        <div class="dot" id="dot-4"></div>
      </div>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    
    const flashOverlay = document.getElementById('flash-overlay');
    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');
    
    const instTitle = document.getElementById('instruction-title');
    const instDesc = document.getElementById('instruction-desc');

    // Offline canvas for clean photo capture (no overlays)
    const offlineCanvas = document.createElement('canvas');
    offlineCanvas.width = 640;
    offlineCanvas.height = 480;
    const offlineCtx = offlineCanvas.getContext('2d');

    const steps = [
      {
        name: "Look Straight",
        desc: "Look directly at the center of the camera.",
        targetX: 0,
        targetY: 0,
        validate: (dx, dy) => Math.sqrt(dx*dx + dy*dy) < 35
      },
      {
        name: "Turn Head Left",
        desc: "Slowly turn your head to your Left.",
        targetX: 120, // Mirrored coordinates
        targetY: 0,
        validate: (dx, dy) => dx > 70 && Math.abs(dy) < 60
      },
      {
        name: "Turn Head Right",
        desc: "Slowly turn your head to your Right.",
        targetX: -120,
        targetY: 0,
        validate: (dx, dy) => dx < -70 && Math.abs(dy) < 60
      },
      {
        name: "Look Up",
        desc: "Tilt your head slightly Upwards.",
        targetX: 0,
        targetY: -100,
        validate: (dx, dy) => dy < -65 && Math.abs(dx) < 60
      },
      {
        name: "Look Down",
        desc: "Tilt your head slightly Downwards.",
        targetX: 0,
        targetY: 100,
        validate: (dx, dy) => dy > 65 && Math.abs(dx) < 60
      }
    ];

    let currentStepIndex = 0;
    let smoothDx = 0;
    let smoothDy = 0;
    let inTargetStartTime = null;
    const holdDurationMs = 900; // 0.9s hold
    const capturedImages = [];
    let isSending = false;

    // Web Audio Synthesized Camera Shutter Sound
    function playShutterSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Shutter noise
        const bufferSize = ctx.sampleRate * 0.1;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        
        const noiseNode = ctx.createBufferSource();
        noiseNode.buffer = buffer;
        
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1000;
        
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.1);
        
        noiseNode.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        
        noiseNode.start();
      } catch (e) {
        console.error("Audio error:", e);
      }
    }

    // Flash Screen Effect
    function triggerFlash() {
      flashOverlay.style.opacity = '1';
      setTimeout(() => {
        flashOverlay.style.opacity = '0';
      }, 150);
    }

    // Update steps dots visual representation
    function updateStepDots() {
      for (let i = 0; i < 5; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (i < currentStepIndex) {
          dot.className = "dot completed";
        } else if (i === currentStepIndex) {
          dot.className = "dot active";
        } else {
          dot.className = "dot";
        }
      }
    }

    // Send values back to Streamlit
    function sendValue(value) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value: value
      }, "*");
    }

    function signalReady() {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:componentReady",
        apiVersion: 1
      }, "*");
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: 650
      }, "*");
    }

    // Handle face mesh detection results
    function onResults(results) {
      // Hide loading screen on first frame
      if (loadingOverlay.style.display !== 'none') {
        loadingOverlay.style.display = 'none';
        updateStepDots();
      }

      // Draw the video frame to the screen canvas (mirrored)
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (isSending) {
        canvasCtx.fillStyle = "rgba(0, 37, 26, 0.7)";
        canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.restore();
        return;
      }

      const activeStep = steps[currentStepIndex];
      instTitle.textContent = `Step ${currentStepIndex + 1} of 5: ${activeStep.name}`;
      instDesc.textContent = activeStep.desc;

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];

        // Key landmarks for head pose
        const nose = landmarks[1];
        const forehead = landmarks[10];
        const chin = landmarks[152];
        const leftCheek = landmarks[234];
        const rightCheek = landmarks[454];

        // Custom distance function
        const getDistance = (p1, p2) => Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));

        const dLeft = getDistance(nose, leftCheek);
        const dRight = getDistance(nose, rightCheek);
        const dUp = getDistance(nose, forehead);
        const dDown = getDistance(nose, chin);

        const yaw = dLeft / dRight;
        const pitch = dUp / dDown;

        // Map log ratios to visual offsets
        const rawDx = Math.log(yaw) * 160;
        const rawDy = Math.log(pitch) * 160;

        // Smooth visual tracking dot
        smoothDx = smoothDx * 0.7 + rawDx * 0.3;
        smoothDy = smoothDy * 0.7 + rawDy * 0.3;

        // Draw crosshair center circle
        const cx = canvasElement.width / 2;
        const cy = canvasElement.height / 2;

        canvasCtx.strokeStyle = "rgba(255, 202, 40, 0.2)";
        canvasCtx.lineWidth = 2;
        canvasCtx.beginPath();
        canvasCtx.arc(cx, cy, 50, 0, 2 * Math.PI);
        canvasCtx.stroke();

        // Draw Target Zone
        const targetCanvasX = cx + activeStep.targetX;
        const targetCanvasY = cy + activeStep.targetY;

        canvasCtx.fillStyle = "rgba(46, 125, 50, 0.25)";
        canvasCtx.strokeStyle = "#ffca28";
        canvasCtx.lineWidth = 3;
        canvasCtx.beginPath();
        canvasCtx.arc(targetCanvasX, targetCanvasY, 40, 0, 2 * Math.PI);
        canvasCtx.fill();
        canvasCtx.stroke();

        // Check if user is in target zone
        const inTarget = activeStep.validate(rawDx, rawDy);
        
        if (inTarget) {
          if (!inTargetStartTime) {
            inTargetStartTime = Date.now();
          }

          const elapsed = Date.now() - inTargetStartTime;
          const ratio = Math.min(elapsed / holdDurationMs, 1);

          // Draw progress ring around target
          canvasCtx.strokeStyle = "#4caf50";
          canvasCtx.lineWidth = 6;
          canvasCtx.beginPath();
          canvasCtx.arc(targetCanvasX, targetCanvasY, 43, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * ratio);
          canvasCtx.stroke();

          if (elapsed >= holdDurationMs) {
            // CAPTURE PHOTO!
            playShutterSound();
            triggerFlash();

            // Draw clean current frame to offline canvas (mirrored)
            offlineCtx.save();
            offlineCtx.translate(offlineCanvas.width, 0);
            offlineCtx.scale(-1, 1);
            offlineCtx.drawImage(results.image, 0, 0, offlineCanvas.width, offlineCanvas.height);
            offlineCtx.restore();

            const imgUrl = offlineCanvas.toDataURL('image/jpeg', 0.85);
            capturedImages.push(imgUrl);

            inTargetStartTime = null;
            currentStepIndex++;
            updateStepDots();

            if (currentStepIndex >= 5) {
              isSending = true;
              instTitle.textContent = "Upload in Progress...";
              instDesc.textContent = "Sending biometric scans back to the fortress. Please wait.";
              setTimeout(() => {
                sendValue(capturedImages);
              }, 600);
            }
          }
        } else {
          inTargetStartTime = null;
        }

        // Draw tracking dot
        canvasCtx.fillStyle = inTarget ? "#4caf50" : "#ffca28";
        canvasCtx.shadowColor = inTarget ? "#4caf50" : "#ffca28";
        canvasCtx.shadowBlur = 10;
        canvasCtx.beginPath();
        canvasCtx.arc(cx + smoothDx, cy + smoothDy, 8, 0, 2 * Math.PI);
        canvasCtx.fill();
        canvasCtx.shadowBlur = 0; // reset
      } else {
        // No face detected
        inTargetStartTime = null;
        canvasCtx.fillStyle = "rgba(183, 28, 28, 0.4)";
        canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
        
        canvasCtx.fillStyle = "#ffcdd2";
        canvasCtx.font = "20px Inter, sans-serif";
        canvasCtx.textAlign = "center";
        // Keep in mind the scaleX(-1) mirror coordinate system
        canvasCtx.save();
        canvasCtx.translate(canvasElement.width, 0);
        canvasCtx.scale(-1, 1);
        canvasCtx.fillText("⚠️ POSITION YOUR FACE IN FRAME", canvasElement.width / 2, canvasElement.height / 2);
        canvasCtx.restore();
      }

      canvasCtx.restore();
    }

    // Set up and start MediaPipe Face Mesh
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    // Initialize Camera feed
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    // Start everything
    navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
      .then((stream) => {
        videoElement.srcObject = stream;
        camera.start()
          .catch((err) => {
            console.error("Camera start error:", err);
            loadingText.textContent = "Error starting webcam. Please check permissions.";
          });
      })
      .catch((err) => {
        console.error("MediaDevices error:", err);
        loadingOverlay.style.backgroundColor = '#b71c1c';
        loadingText.innerHTML = "<strong>Camera Access Denied</strong><br>Please enable camera permissions to continue registration.";
      });

    // Signal readiness to Streamlit
    signalReady();
  </script>
</body>
</html>
