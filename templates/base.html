<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Robotiators Attendance{% endblock %}</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }

        header {
            background-color: #1a1a1a;
            border-bottom: 2px solid #b30000;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            background-color: #b30000;
            color: white;
            padding: 5px 10px;
            font-weight: bold;
            border-radius: 3px;
        }

        nav a {
            color: #b30000;
            text-decoration: none;
            margin-left: 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: #ff3333;
            text-decoration: underline;
        }

        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 15px;
        }

        h1, h2, h3 {
            color: #ff3333;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }

        th, td {
            border: 1px solid #333;
            padding: 8px 12px;
            text-align: left;
        }

        th {
            background-color: #1a1a1a;
            color: #ff3333;
        }

        tr:nth-child(even) {
            background-color: #161616;
        }

        input[type="text"],
        input[type="password"],
        select {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 3px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        input[type="submit"],
        button,
        .btn {
            background-color: #b30000;
            color: white;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 3px;
            text-decoration: none;
            display: inline-block;
        }

        input[type="submit"]:hover,
        button:hover,
        .btn:hover {
            background-color: #d60000;
        }

        .btn-secondary {
            background-color: #444;
        }
        .btn-secondary:hover {
            background-color: #555;
        }

        .btn-danger {
            background-color: #cc3333;
        }
        .btn-danger:hover {
            background-color: #e60000;
        }

        .alert {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 3px;
            font-weight: bold;
        }

        .alert-success {
            background-color: #1e4620;
            color: #a3e2a6;
            border: 1px solid #2e7d32;
        }

        .alert-error {
            background-color: #5c1919;
            color: #ffb3b3;
            border: 1px solid #c62828;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            border-top: 1px solid #333;
            color: #777;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-section">
            <span class="logo">888</span>
            <strong>Team 888 Attendance</strong>
        </div>
        <nav>
            <a href="/">Home</a>
            <a href="/kiosk">Kiosk</a>
            <a href="/logging">Check In/Out</a>
            <a href="/registration">Register</a>
            <a href="/admin">Admin</a>
        </nav>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>



    <script>
        // Simple global Socket.IO setup for live page updates
        const socket = io();
        window.onStateUpdate = [];
        socket.on('state_update', (data) => {
            window.onStateUpdate.forEach(cb => cb(data));
        });
    </script>
</body>
</html>
