<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Robotiator Files{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            color: #e8e8e8;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
        }

        /* Navbar */
        nav {
            background-color: #0d0d0d;
            padding: 1rem;
            border-bottom: 4px solid #cc0000;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
            box-shadow: 0 2px 8px rgba(204, 0, 0, 0.3);
        }

        .nav-title {
            color: #cc0000;
            font-size: 1.3rem;
            font-weight: bold;
            margin-right: auto;
            text-shadow: 2px 2px #000;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-logo {
            width: 40px;
            height: 40px;
            background-color: #cc0000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
        }

        .navbtn {
            background-color: #cc0000;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 0.6rem 1.2rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.5s ease;
            text-decoration: none;
            display: inline-block;
            min-width: 120px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .navbtn:hover {
            background-color: #ff0000;
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(204, 0, 0, 0.6);
            padding: 0.6rem 2rem;
            letter-spacing: 1px;
        }

        .navbtn.active {
            background-color: #ff4444;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
        }

        /* Main Container */
        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        h1, h2, h3 {
            color: #cc0000;
            text-shadow: 2px 2px #000;
            margin: 1.5rem 0 1rem 0;
        }

        h1 {
            font-size: 2rem;
        }

        h2 {
            font-size: 1.5rem;
        }

        h3 {
            font-size: 1.2rem;
        }

        /* Forms */
        form {
            background-color: #252525;
            padding: 1.5rem;
            border-radius: 8px;
            border-left: 4px solid #cc0000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        input[type="text"],
        input[type="password"],
        input[type="number"],
        input[type="email"],
        select {
            width: 100%;
            padding: 0.8rem;
            margin: 0.8rem 0;
            background-color: #333333;
            color: #e8e8e8;
            border: 2px solid #444444;
            border-radius: 5px;
            font-size: 1rem;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="number"]:focus,
        input[type="email"]:focus,
        select:focus {
            outline: none;
            border-color: #cc0000;
            background-color: #3a3a3a;
            box-shadow: 0 0 8px rgba(204, 0, 0, 0.4);
        }

        input[type="submit"],
        button {
            background-color: #cc0000;
            color: white;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 0.5rem;
        }

        input[type="submit"]:hover,
        button:hover {
            background-color: #ff0000;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(204, 0, 0, 0.6);
        }

        input[type="submit"]:active,
        button:active {
            transform: translateY(0);
        }

        /* Cards */
        .card {
            background-color: #252525;
            border-left: 4px solid #cc0000;
            padding: 1.5rem;
            margin: 1rem 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .card h3 {
            margin-top: 0;
        }

        /* Messages */
        .info {
            background-color: #1a3a4a;
            border-left: 4px solid #0099cc;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 5px;
            color: #6dd5ff;
        }

        .success {
            background-color: #1b3a1b;
            border-left: 4px solid #4caf50;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 5px;
            color: #90ee90;
        }

        .error {
            background-color: #3a1a1a;
            border-left: 4px solid #ff4444;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 5px;
            color: #ff8888;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem 1rem;
            color: #cc0000;
            margin-top: 3rem;
            border-top: 2px solid #cc0000;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                align-items: stretch;
            }

            .nav-title {
                margin-right: 0;
                margin-bottom: 0.5rem;
                justify-content: center;
            }

            .navbtn {
                width: 100%;
                text-align: center;
            }

            h1 {
                font-size: 1.5rem;
            }

            h2 {
                font-size: 1.2rem;
            }

            .container {
                margin: 1rem auto;
            }
        }

        /* Table Styles */
        table {
            width: 100%;
            margin: 1rem 0;
            border-collapse: collapse;
            background-color: #252525;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #3a3a3a;
        }

        th {
            background-color: #1a1a1a;
            color: #cc0000;
            font-weight: 600;
            border-bottom: 2px solid #cc0000;
        }

        tr:hover {
            background-color: #2a2a2a;
        }

        /* Team branding */
        .team-badge {
            display: inline-block;
            background-color: #cc0000;
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin: 0.5rem 0.5rem 0.5rem 0;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav>
        <div class="nav-title">
            <div class="nav-logo">888</div>
            <span>Robotiator Files</span>
        </div>
        <a href="/logging" class="navbtn">Logging</a>
        <a href="/registration" class="navbtn">Registration</a>
        <a href="/admin" class="navbtn">Admin</a>
    </nav>

    <!-- Main Content -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer>
        <p>🤖 Built for Team 888 Robotiators | No Maintenance Required.</p>
    </footer>
</body>
</html>
